# Test Automation Framework Configuration

# Logging Configuration
logging.level=ALL
logging.success.enabled=true
logging.info.enabled=true
logging.warning.enabled=true
logging.error.enabled=true
logging.test.execution.enabled=true
logging.performance.enabled=true
logging.performance.threshold.ms=1000
logging.browser.enabled=true
logging.api.enabled=true

# Test Configuration
browser=chrome
headless=false
environment=test
timeout=30
baseUrl=
threadCount=1
retryEnabled=true
maxRetries=1
screenshotOnFailure=true
videoRecording=false

# Data Source Configuration
dataSource=excel
excelPath=src/test/resources/testdata.xlsx
sheetName=TestData
jsonPath=src/test/resources/testdata.json

# Reporting Configuration
reporting.enabled=true
reporting.format=html
reporting.screenshotOnFailure=true
reporting.includeStackTrace=true

# Grid Configuration
grid.enabled=false
grid.hubUrl=http://localhost:4444/wd/hub

# Cloud Testing Configuration
cloud.enabled=false
cloud.provider=browserstack
cloud.username=
cloud.accessKey=
cloud.projectName=${project.name}
cloud.buildName=
cloud.sessionName=
cloud.timeout=300
cloud.parallelSessions=${threadCount}
cloud.region=us-west-1
cloud.videoEnabled=${videoRecording}
cloud.screenshotEnabled=${screenshotOnFailure}
cloud.localTesting=false
cloud.tunnelIdentifier=

# Cloud Provider Specific Configuration
cloud.browserstack.hubUrl=https://hub-cloud.browserstack.com/wd/hub
cloud.browserstack.apiUrl=https://api.browserstack.com

cloud.saucelabs.hubUrl=https://ondemand.us-west-1.saucelabs.com:443/wd/hub
cloud.saucelabs.apiUrl=https://api.us-west-1.saucelabs.com

cloud.lambdatest.hubUrl=https://hub.lambdatest.com/wd/hub
cloud.lambdatest.apiUrl=https://api.lambdatest.com

cloud.crossbrowsertesting.hubUrl=https://hub.crossbrowsertesting.com:80/wd/hub
cloud.crossbrowsertesting.apiUrl=https://crossbrowsertesting.com/api/v3

# Mobile Testing Configuration
mobile.enabled=false
mobile.platform=android
mobile.deviceName=
mobile.appPath=

# Performance Testing Configuration
performance.enabled=true
performance.threshold.ms=5000
performance.monitoring=true

# Security Testing Configuration
security.enabled=true
security.sslValidation=true
security.vulnerabilityScan=true
