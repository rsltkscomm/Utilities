# Production Environment Configuration
# This file contains production-specific configuration overrides

# Environment
environment=prod

# Browser Configuration
browser=chromeheadless
headless=true
timeout=60

# Test Configuration
threadCount=5
retryEnabled=true
maxRetries=3
screenshotOnFailure=true
videoRecording=true

# Data Source Configuration
dataSource=excel
excelPath=src/test/resources/testdata-prod.xlsx
sheetName=TestData
jsonPath=src/test/resources/testdata-prod.json

# Reporting Configuration
reporting.enabled=true
reporting.format=html
reporting.screenshotOnFailure=true
reporting.includeStackTrace=true

# Grid Configuration
grid.enabled=true
grid.hubUrl=http://selenium-hub:4444/wd/hub

# Cloud Testing Configuration
cloud.enabled=true
cloud.provider=browserstack
cloud.username=${BROWSERSTACK_USERNAME}
cloud.accessKey=${BROWSERSTACK_ACCESS_KEY}

# Mobile Testing Configuration
mobile.enabled=false
mobile.platform=android
mobile.deviceName=
mobile.appPath=

# Performance Testing Configuration
performance.enabled=true
performance.threshold.ms=5000
performance.monitoring=true

# Security Testing Configuration
security.enabled=true
security.sslValidation=true
security.vulnerabilityScan=true

# Logging Configuration
logging.level=INFO
logging.success.enabled=true
logging.info.enabled=true
logging.warning.enabled=true
logging.error.enabled=true
logging.test.execution.enabled=true
logging.performance.enabled=true
logging.performance.threshold.ms=2000
logging.browser.enabled=true
logging.api.enabled=true

# Path Configuration
paths.base=/opt/automation
paths.oneDrive=/opt/automation/reports

# Project Configuration
project.name=ProdProject
user.name=produser
release.version=1.0.0
suite.name=ProdSuite
account=prodaccount

# Bug Reporting
bug.reporting=Yes

# Automation Data
automation.dataSheetName=AutomationData_Prod
automation.dataPath=/opt/automation/data/

# Regression Flags
regression.accountSetup=/opt/automation/data/regression/account-setup-prod.xlsx
regression.audience=/opt/automation/data/regression/audience-prod.xlsx
regression.communication=/opt/automation/data/regression/communication-prod.xlsx
regression.preferences=/opt/automation/data/regression/preferences-prod.xlsx
regression.analytics=/opt/automation/data/regression/analytics-prod.xlsx

# Deployment
deployment.checklist=/opt/automation/data/deployment/checklist-prod.xlsx

# Performance
performance.pageLoadTesting=/opt/automation/data/performance/page-load-prod.xlsx

# Account Management
account.newCreationChecklist=/opt/automation/data/account/new-creation-prod.xlsx

# Feature Testing
feature.checklist=/opt/automation/data/feature/checklist-prod.xlsx

# Reporting Flags
reporting.dateWise=yes
reporting.releaseWise=yes
reporting.accountWise=yes
