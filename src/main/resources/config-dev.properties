# Development Environment Configuration
# This file contains development-specific configuration overrides

# Environment
environment=dev

# Browser Configuration
browser=chrome
headless=false
timeout=30

# Test Configuration
threadCount=1
retryEnabled=true
maxRetries=2
screenshotOnFailure=true
videoRecording=false

# Data Source Configuration
dataSource=excel
excelPath=src/test/resources/testdata-dev.xlsx
sheetName=TestData
jsonPath=src/test/resources/testdata-dev.json

# Reporting Configuration
reporting.enabled=true
reporting.format=html
reporting.screenshotOnFailure=true
reporting.includeStackTrace=true

# Grid Configuration
grid.enabled=false
grid.hubUrl=http://localhost:4444/wd/hub

# Cloud Testing Configuration
cloud.enabled=false
cloud.provider=browserstack
cloud.username=
cloud.accessKey=

# Mobile Testing Configuration
mobile.enabled=false
mobile.platform=android
mobile.deviceName=
mobile.appPath=

# Performance Testing Configuration
performance.enabled=true
performance.threshold.ms=3000
performance.monitoring=true

# Security Testing Configuration
security.enabled=true
security.sslValidation=true
security.vulnerabilityScan=false

# Logging Configuration
logging.level=DEBUG
logging.success.enabled=true
logging.info.enabled=true
logging.warning.enabled=true
logging.error.enabled=true
logging.test.execution.enabled=true
logging.performance.enabled=true
logging.performance.threshold.ms=500
logging.browser.enabled=true
logging.api.enabled=true

# Path Configuration
paths.base=C:\\AQAcred
paths.oneDrive=C:\\Users\\%USERNAME%\\OneDrive - RESULTICKS DIGITALS INDIA PRIVATE LIMITED\\Automation

# Project Configuration
project.name=DevProject
user.name=devuser
release.version=1.0.0-dev
suite.name=DevSuite
account=devaccount

# Bug Reporting
bug.reporting=No

# Automation Data
automation.dataSheetName=AutomationData_Dev
automation.dataPath=src/test/resources/

# Regression Flags
regression.accountSetup=src/test/resources/regression/account-setup-dev.xlsx
regression.audience=src/test/resources/regression/audience-dev.xlsx
regression.communication=src/test/resources/regression/communication-dev.xlsx
regression.preferences=src/test/resources/regression/preferences-dev.xlsx
regression.analytics=src/test/resources/regression/analytics-dev.xlsx

# Deployment
deployment.checklist=src/test/resources/deployment/checklist-dev.xlsx

# Performance
performance.pageLoadTesting=src/test/resources/performance/page-load-dev.xlsx

# Account Management
account.newCreationChecklist=src/test/resources/account/new-creation-dev.xlsx

# Feature Testing
feature.checklist=src/test/resources/feature/checklist-dev.xlsx

# Reporting Flags
reporting.dateWise=yes
reporting.releaseWise=yes
reporting.accountWise=yes
